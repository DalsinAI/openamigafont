name: OpenFont CI

on:
  push:
  pull_request:

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libfreetype6-dev libharfbuzz-dev fonts-dejavu-core
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build -j2
      - name: Test
        run: ctest --test-dir build --output-on-failure

  m68k:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compiler libraries
        run: sudo apt-get update && sudo apt-get install -y libgmp10 libmpfr6 libmpc3
      - name: OpenAmigaGCC 16.2.0-open2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v16.2.0-open2 --repo DalsinAI/openamigagcc \
            --pattern 'openamigagcc-16.2.0-open2-x86_64-linux.tar.xz' \
            --pattern 'SHA256SUMS'
          sha256sum -c --ignore-missing SHA256SUMS
          tar -xJf openamigagcc-16.2.0-open2-x86_64-linux.tar.xz
      - name: 68000, 68020 and 68040
        run: CC="$GITHUB_WORKSPACE/openamigagcc-16.2.0-open2-x86_64-linux/bin/m68k-amigaos-gcc" sh amiga/build.sh
